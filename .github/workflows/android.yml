name: Ultimate Android Build Workflow

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto-locate Project and Build
        run: |
          echo "=== 1. Searching for Gradle wrapper (gradlew) ==="
          GRADLEW_FILE=$(find . -name "gradlew" -maxdepth 4)
          
          if [ -z "$GRADLEW_FILE" ]; then
            echo "❌ Error: gradlew file not found! Please make sure your project files are uploaded correctly in the repository."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_FILE")
          echo "✅ Found project directory at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          
          echo "=== 2. Building Debug APK ==="
          ./gradlew assembleDebug --stacktrace || {
            echo "❌ APK Build Failed! Checking details..."
            exit 1
          }
          
          echo "=== 3. Building Debug AAB (App Bundle) ==="
          ./gradlew bundleDebug --stacktrace || {
            echo "❌ AAB Build Failed! Checking details..."
            exit 1
          }
          
          # حفظ المسار للاستخدام في خطوة الرفع
          echo "PROJECT_PATH=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/bundle/debug/*.aab
