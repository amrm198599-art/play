name: Build Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto-locate Project and Build APK & AAB
        run: |
          echo "=== Searching for gradlew ==="
          GRADLEW_FILE=$(find . -name "gradlew" -maxdepth 4)
          
          if [ -z "$GRADLEW_FILE" ]; then
            echo "❌ Error: gradlew file not found!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_FILE")
          echo "✅ Found project at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          
          echo "=== Building APK & AAB ==="
          ./gradlew assembleDebug
          ./gradlew bundleDebug
          
          echo "PROJECT_PATH=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/bundle/debug/*.aab
