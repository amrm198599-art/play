name: Build Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find project (unzip if needed)
        run: |
          mkdir -p build_src
          for pass in 1 2; do
            find . -name '*.zip' -not -path './.git/*' | while read -r z; do
              echo "Unzipping $z"; unzip -qo "$z" -d build_src
            done
          done
          SETTINGS=$(find . -name 'settings.gradle*' -not -path './.git/*' -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found. Repo contents:"
            find . -maxdepth 3 -not -path './.git/*' | head -60
            exit 1
          fi
          echo "Project: $SETTINGS"
          echo "PROJECT_DIR=$(cd "$(dirname "$SETTINGS")" && pwd)" >> "$GITHUB_ENV"

      - name: Prepare signing (only if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$PROJECT_DIR/upload-key.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$PROJECT_DIR/upload-key.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
              > "$PROJECT_DIR/keystore.properties"
          fi

      - name: Build APK and AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: '**/build/outputs/bundle/**/*.aab'
          if-no-files-found: error
