name: Build Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project and Build APK & AAB
        run: |
          echo "Searching for gradlew..."
          # البحث التلقائي عن المجلد الذي يحتوي على ملف التشغيل
          GRADLEW_PATH=$(find . -name "gradlew" -maxdepth 3)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project directory at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          
          # بناء الـ APK والـ AAB
          ./gradlew assembleDebug
          ./gradlew bundleDebug
          
          # حفظ مسار الخروج لنقله للأرتيفاكت
          echo "BUILD_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ env.BUILD_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: ${{ env.BUILD_DIR }}/app/build/outputs/bundle/debug/*.aab
