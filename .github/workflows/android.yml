name: Universal Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK and AAB (Universal Handler)
        run: |
          echo "🔍 Searching for project root..."
          GRADLEW_FILE=$(find . -name "gradlew" -maxdepth 4)
          
          if [ -z "$GRADLEW_FILE" ]; then
            echo "❌ Error: gradlew not found! Please check your folder structure."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_FILE")
          echo "📂 Project found at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          
          echo "🚀 Starting Gradle Build (Debug APK & AAB)..."
          # استخدام --stacktrace لطباعة تفاصيل أي خطأ برمجي بوضوح إذا حدث
          ./gradlew assembleDebug bundleDebug --stacktrace
          
          echo "PROJECT_PATH=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/bundle/debug/*.aab
