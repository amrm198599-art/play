name: Build APK and AAB

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q PlayCheck.zip -d build_src
          SETTINGS=$(find build_src -name settings.gradle.kts -print -quit)
          [ -n "$SETTINGS" ] || { echo "settings.gradle.kts not found in zip"; exit 1; }
          echo "PROJECT_DIR=$(cd "$(dirname "$SETTINGS")" && pwd)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare signing (only if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$PROJECT_DIR/upload-key.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$PROJECT_DIR/upload-key.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
              > "$PROJECT_DIR/keystore.properties"
            echo "Signing: release keystore configured"
          else
            echo "Signing: no secrets found, release outputs will be unsigned"
          fi

      - name: Build debug APK, release APK and release AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build_src/**/app/build/outputs/apk/**/*.apk
            build_src/**/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_src/**/app/build/outputs/apk/**/*.apk
            build_src/**/app/build/outputs/bundle/**/*.aab
